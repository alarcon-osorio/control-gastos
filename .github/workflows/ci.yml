name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permisos mínimos para el token de GITHUB_TOKEN
permissions:
  contents: read
  pull-requests: write

# Cancela runs obsoletos del mismo ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Security audit (informativo)
        # npm audit solo cubre dependencias conocidas (SCA básico).
        # No se considera un análisis de seguridad completo.
        run: npm audit --audit-level=moderate || true

      - name: Run tests
        run: npm run test -- --watch=false

      - name: Build (production)
        run: npm run build

  sonar:
    name: SonarCloud analysis
    needs: ci
    runs-on: ubuntu-latest
    # El análisis se ejecuta en push a main y en PRs.
    steps:
      - name: Checkout (full history for blame)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test -- --watch=false --coverage --coverage-reporters=lcov

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  # Integración Veracode: ver .github/workflows/veracode.yml (desactivada por defecto)
