<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Gastos</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#273449;--text:#f1f5f9;--muted:#94a3b8;--accent:#38bdf8;--accent2:#22c55e;--danger:#ef4444;--warn:#f59e0b;--border:#334155}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px}
body{padding-bottom:70px}
.app-header{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:700;font-size:18px;color:var(--accent)}
.mes-badge{font-size:12px;color:var(--muted);background:var(--card);padding:4px 10px;border-radius:12px}
.container{padding:12px 16px;max-width:600px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--border)}
.card-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stat{font-size:22px;font-weight:700}
.stat.green{color:var(--accent2)}.stat.blue{color:var(--accent)}.stat.warn{color:var(--warn)}
.progress{height:8px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:8px}
.progress>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.group-title{font-size:14px;font-weight:600;color:var(--accent);margin:14px 0 6px;display:flex;align-items:center;gap:6px}
.obl-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.obl-item:last-child{border-bottom:none}
.obl-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:14px;background:transparent;padding:0;font:inherit;color:inherit}
.obl-check.paid{background:var(--accent2);border-color:var(--accent2);color:#fff}
.obl-info{flex:1;min-width:0}
.obl-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obl-meta{font-size:12px;color:var(--muted)}
.obl-amount{font-weight:700;font-size:15px}
.obl-actions{display:flex;gap:6px}
.btn{background:var(--accent);color:#0f172a;border:none;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;font-size:14px}
.btn.secondary{background:var(--card2);color:var(--text)}.btn.danger{background:var(--danger);color:#fff}.btn.small{padding:6px 10px;font-size:12px;border-radius:8px}
.btn:active{transform:scale(.97)}
.input,select{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;font-size:15px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.form-group{margin-bottom:10px}
.fab{position:fixed;right:16px;bottom:80px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#0f172a;font-size:26px;border:none;box-shadow:0 4px 12px rgba(0,0,0,.4);cursor:pointer;z-index:9}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 0 env(safe-area-inset-bottom);z-index:10}
.nav-btn{flex:1;background:none;border:none;color:var(--muted);font-size:11px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav-btn.active{color:var(--accent)}.nav-btn .icon{font-size:20px}
.page{display:none}.page.active{display:block}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:flex-end}
.modal-backdrop.show{display:flex}
.modal{background:var(--card);width:100%;max-width:600px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px;max-height:90vh;overflow-y:auto}
.modal h3{margin:0 0 12px}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--card2);color:var(--text);padding:10px 16px;border-radius:10px;z-index:30;display:none}
.toast.show{display:block}
.gasto-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.gasto-item:last-child{border-bottom:none}
.param-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.empty{text-align:center;color:var(--muted);padding:20px;font-size:13px}
</style>
</head>
<body>
<div class="app-header"><div class="brand">💰 Gastos</div><div class="mes-badge" id="mesBadge"></div></div>
<div class="toast" id="toast"></div>
<div class="container">

<div class="page active" id="page-dashboard">
  <div class="card">
    <div class="card-title">Resumen del mes</div>
    <div class="row"><span>Total esperado (obligaciones)</span><span class="stat" id="d-esperado">$0</span></div>
    <div class="row"><span>Pagado</span><span class="stat green" id="d-pagado">$0</span></div>
    <div class="row"><span>Pendiente</span><span class="stat warn" id="d-pendiente">$0</span></div>
    <div class="progress"><div id="d-prog" style="width:0%"></div></div>
    <div style="font-size:12px;color:var(--muted);margin-top:6px" id="d-progtext"></div>
  </div>
  <div class="card">
    <div class="card-title">Obligaciones por grupo</div>
    <div class="row"><span>Día 10</span><span id="d-g10"></span></div>
    <div class="row"><span>Día 25</span><span id="d-g25"></span></div>
    <div class="row"><span>Hormigas</span><span id="d-gh"></span></div>
  </div>
  <div class="card">
    <div class="card-title">Gastos del mes</div>
    <div class="row"><span>Total gastos</span><span class="stat blue" id="d-gastos">$0</span></div>
    <div class="row"><span>Cantidad</span><span id="d-gcant">0</span></div>
  </div>
</div>
<div class="page" id="page-obligaciones"><div id="obl-list"></div></div>
<div class="page" id="page-gastos"><div id="gastos-list"></div></div>
<div class="page" id="page-parametros">
  <div class="card"><div class="card-title">Categorías</div><div id="param-cat"></div><button class="btn small" onclick="openParamForm('categoria')">+ Agregar</button></div>
  <div class="card"><div class="card-title">Métodos de pago</div><div id="param-met"></div><button class="btn small" onclick="openParamForm('metodoPago')">+ Agregar</button></div>
</div>
</div>
<button class="fab" id="fab" onclick="onFab()">+</button>
<div class="bottom-nav">
  <button class="nav-btn active" data-page="dashboard" onclick="showPage('dashboard')"><span class="icon">📊</span>Resumen</button>
  <button class="nav-btn" data-page="obligaciones" onclick="showPage('obligaciones')"><span class="icon">✅</span>Obligaciones</button>
  <button class="nav-btn" data-page="gastos" onclick="showPage('gastos')"><span class="icon">🧾</span>Gastos</button>
  <button class="nav-btn" data-page="parametros" onclick="showPage('parametros')"><span class="icon">⚙️</span>Parámetros</button>
</div>
<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()"><h3 id="modalTitle"></h3><div id="modalBody"></div></div>
</div>
<script>
let DATA={obligaciones:[],pagos:[],gastos:[],parametros:[],mesActual:''};
function money(n){return '$'+Number(n||0).toLocaleString('es-CO')}
function fmtMes(m){if(!m)return '';const[y,mo]=m.split('-');const meses=['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];return meses[parseInt(mo)]+' '+y}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function showPage(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('page-'+p).classList.add('active');document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.page===p));const fab=document.getElementById('fab');fab.style.display=(p==='obligaciones'||p==='gastos')?'block':'none';if(p==='dashboard')renderDashboard();if(p==='obligaciones')renderObligaciones();if(p==='gastos')renderGastos();if(p==='parametros')renderParametros()}
function onFab(){const a=document.querySelector('.page.active').id;if(a==='page-obligaciones')openOblForm();else if(a==='page-gastos')openGastoForm()}
function showModal(t,b){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=b;document.getElementById('modalBackdrop').classList.add('show')}
function closeModal(e){if(!e||e.target.id==='modalBackdrop')document.getElementById('modalBackdrop').classList.remove('show')}
function estaPagada(id,mes){return DATA.pagos.some(p=>p.obligacionId===id&&p.mes===mes)}
function renderDashboard(){if(!DATA)DATA={obligaciones:[],pagos:[],gastos:[],parametros:[],mesActual:''};const mes=DATA.mesActual||'';const activas=DATA.obligaciones.filter(o=>o.activa);const esperado=activas.reduce((s,o)=>s+o.monto,0);const pagado=DATA.pagos.filter(p=>p.mes===mes).reduce((s,p)=>{const o=DATA.obligaciones.find(x=>x.id===p.obligacionId);return s+(o?o.monto:0)},0);const pendiente=esperado-pagado;document.getElementById('d-esperado').textContent=money(esperado);document.getElementById('d-pagado').textContent=money(pagado);document.getElementById('d-pendiente').textContent=money(pendiente);const pct=esperado>0?Math.min(100,Math.round(pagado/esperado*100)):0;document.getElementById('d-prog').style.width=pct+'%';document.getElementById('d-progtext').textContent=pct+'% pagado';const g10=activas.filter(o=>o.diaPago===10);const g25=activas.filter(o=>o.diaPago===25);const gh=activas.filter(o=>o.diaPago===null);function gr(arr){const tot=arr.reduce((s,o)=>s+o.monto,0);const pag=arr.filter(o=>estaPagada(o.id,mes)).reduce((s,o)=>s+o.monto,0);return money(pag)+' / '+money(tot)}document.getElementById('d-g10').textContent=gr(g10)+' ('+g10.length+')';document.getElementById('d-g25').textContent=gr(g25)+' ('+g25.length+')';document.getElementById('d-gh').textContent=gr(gh)+' ('+gh.length+')';const mg=DATA.gastos.filter(g=>(g.fecha||'').startsWith(mes));document.getElementById('d-gastos').textContent=money(mg.reduce((s,g)=>s+g.monto,0));document.getElementById('d-gcant').textContent=mg.length;document.getElementById('mesBadge').textContent=fmtMes(mes)}

function grupoLabel(d){return d===10?'Día 10':d===25?'Día 25':'Hormigas'}
function renderObligaciones(){if(!DATA)DATA={obligaciones:[],pagos:[],gastos:[],parametros:[],mesActual:''};const mes=DATA.mesActual||'';const activas=DATA.obligaciones.filter(o=>o.activa);const grupos={10:[],25:[],null:[]};activas.forEach(o=>{if(grupos[o.diaPago]!==undefined)grupos[o.diaPago].push(o);else grupos[null].push(o)});let html='';[10,25,null].forEach(function(d){const arr=grupos[d];if(!arr.length)return;const total=arr.reduce((s,o)=>s+o.monto,0);const pag=arr.filter(o=>estaPagada(o.id,mes)).reduce((s,o)=>s+o.monto,0);html+='<div class="group-title">'+grupoLabel(d)+' <span style="color:var(--muted);font-weight:400;font-size:12px">'+money(pag)+'/'+money(total)+'</span></div>';arr.forEach(function(o){const paid=estaPagada(o.id,mes);html+='<div class="card" style="padding:10px;margin-bottom:8px"><div class="obl-item" style="border:none;padding:0"><button class="obl-check '+(paid?'paid':'')+'" onclick="togglePago('+o.id+')" type="button">'+(paid?'✓':'')+'</button><div class="obl-info"><div class="obl-name">'+esc(o.nombre)+'</div><div class="obl-meta">'+esc(o.categoria)+'</div></div><div class="obl-amount">'+money(o.monto)+'</div></div><div class="obl-actions" style="margin-top:8px;justify-content:flex-end"><button class="btn small secondary" onclick="openOblForm('+o.id+')">Editar</button><button class="btn small danger" onclick="delObl('+o.id+')">Borrar</button></div></div>'})});if(!activas.length)html='<div class="empty">Sin obligaciones. Toca + para agregar.</div>';const inact=DATA.obligaciones.filter(o=>!o.activa);if(inact.length){html+='<div class="group-title" style="color:var(--muted)">Inactivas</div>';inact.forEach(function(o){html+='<div class="card" style="padding:10px;margin-bottom:8px;opacity:.6"><div class="obl-item" style="border:none;padding:0"><div class="obl-info"><div class="obl-name">'+esc(o.nombre)+'</div></div><div class="obl-amount">'+money(o.monto)+'</div></div><div class="obl-actions" style="margin-top:8px;justify-content:flex-end"><button class="btn small secondary" onclick="openOblForm('+o.id+')">Editar</button><button class="btn small danger" onclick="delObl('+o.id+')">Borrar</button></div></div>'})}document.getElementById('obl-list').innerHTML=html}
function togglePago(id){const mes=DATA.mesActual;if(estaPagada(id,mes)){google.script.run.withSuccessHandler(function(){toast('Desmarcado');refresh()}).withFailureHandler(function(e){toast('Error: '+(e&&e.message?e.message:e))}).desmarcar(id,mes)}else{google.script.run.withSuccessHandler(function(r){toast('✓ Gasto registrado');refresh()}).withFailureHandler(function(e){toast('Error: '+(e&&e.message?e.message:e))}).marcarPagada(id,mes)}}
function openOblForm(id){const obl=id?DATA.obligaciones.find(o=>o.id===id):null;const cats=DATA.parametros.filter(p=>p.tipo==='categoria').map(p=>p.nombre);const dias=[10,25,null];let html='';html+='<div class="form-group"><label>Nombre</label><input class="input" id="f-nombre" value="'+attr(obl?obl.nombre:'')+'"></div>';html+='<div class="form-group"><label>Monto (COP)</label><input class="input" type="number" id="f-monto" value="'+(obl?obl.monto:'')+'"></div>';html+='<div class="form-group"><label>Día de pago</label><select class="input" id="f-dia">';dias.forEach(function(d){const sel=obl&&obl.diaPago===d?'selected':'';const lbl=d===null?'Hormigas (sin día)':'Día '+d;html+='<option value="'+(d===null?'null':d)+'" '+sel+'>'+lbl+'</option>'});html+='</select></div>';html+='<div class="form-group"><label>Categoría</label><select class="input" id="f-cat">';cats.forEach(function(c){const sel=obl&&obl.categoria===c?'selected':'';html+='<option '+sel+'>'+esc(c)+'</option>'});html+='</select></div>';html+='<div class="form-group"><label><input type="checkbox" id="f-activa" '+(obl?(obl.activa?'checked':''):'checked')+'> Activa</label></div>';html+='<div style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="saveObl('+(id||'null')+')">Guardar</button><button class="btn secondary" onclick="closeModal()">Cancelar</button></div>';showModal(id?'Editar obligación':'Nueva obligación',html)}
function saveObl(id){const diaRaw=document.getElementById('f-dia').value;const o={nombre:document.getElementById('f-nombre').value,monto:Number(document.getElementById('f-monto').value),diaPago:diaRaw==='null'?null:Number(diaRaw),categoria:document.getElementById('f-cat').value,activa:document.getElementById('f-activa').checked};if(id){google.script.run.withSuccessHandler(function(){closeModal();refresh()}).actualizarObligacion(id,o)}else{google.script.run.withSuccessHandler(function(){closeModal();refresh()}).agregarObligacion(o)}}
function delObl(id){if(!confirm('¿Borrar esta obligación?'))return;google.script.run.withSuccessHandler(function(){refresh()}).eliminarObligacion(id)}

function renderGastos(){const lista=DATA.gastos.slice().sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));let html='';if(!lista.length)html='<div class="empty">Sin gastos.</div>';lista.forEach(function(g){html+='<div class="card" style="padding:10px;margin-bottom:8px"><div class="gasto-item" style="border:none;padding:0"><div><div style="font-weight:600">'+esc(g.descripcion||g.categoria)+'</div><div style="font-size:12px;color:var(--muted)">'+g.fecha+' · '+esc(g.categoria)+' · '+esc(g.metodoPago)+'</div></div><div style="text-align:right"><div style="font-weight:700">'+money(g.monto)+'</div><button class="btn small danger" style="margin-top:4px" onclick="delGasto('+g.id+')">Borrar</button></div></div></div>'});document.getElementById('gastos-list').innerHTML=html}
function openGastoForm(){const cats=DATA.parametros.filter(p=>p.tipo==='categoria').map(p=>p.nombre);const mets=DATA.parametros.filter(p=>p.tipo==='metodoPago').map(p=>p.nombre);const hoy=new Date().toISOString().slice(0,10);let html='';html+='<div class="form-group"><label>Monto (COP)</label><input class="input" type="number" id="g-monto"></div>';html+='<div class="form-group"><label>Categoría</label><select class="input" id="g-cat">'+cats.map(c=>'<option>'+esc(c)+'</option>').join('')+'</select></div>';html+='<div class="form-group"><label>Método de pago</label><select class="input" id="g-met">'+mets.map(m=>'<option>'+esc(m)+'</option>').join('')+'</select></div>';html+='<div class="form-group"><label>Fecha</label><input class="input" type="date" id="g-fecha" value="'+hoy+'"></div>';html+='<div class="form-group"><label>Descripción</label><input class="input" id="g-desc"></div>';html+='<div style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="saveGasto()">Guardar</button><button class="btn secondary" onclick="closeModal()">Cancelar</button></div>';showModal('Nuevo gasto',html)}
function saveGasto(){const g={monto:Number(document.getElementById('g-monto').value),categoria:document.getElementById('g-cat').value,metodoPago:document.getElementById('g-met').value,fecha:document.getElementById('g-fecha').value,descripcion:document.getElementById('g-desc').value};google.script.run.withSuccessHandler(function(){closeModal();refresh()}).agregarGasto(g)}
function delGasto(id){if(!confirm('¿Borrar este gasto?'))return;google.script.run.withSuccessHandler(function(){refresh()}).eliminarGasto(id)}
function renderParametros(){const cats=DATA.parametros.filter(p=>p.tipo==='categoria');const mets=DATA.parametros.filter(p=>p.tipo==='metodoPago');document.getElementById('param-cat').innerHTML=cats.map(p=>'<div class="param-item"><span>'+esc(p.nombre)+'</span><button class="btn small danger" onclick="delParam('+p.id+')">Borrar</button></div>').join('')||'<div class="empty">Sin categorías.</div>';document.getElementById('param-met').innerHTML=mets.map(p=>'<div class="param-item"><span>'+esc(p.nombre)+'</span><button class="btn small danger" onclick="delParam('+p.id+')">Borrar</button></div>').join('')||'<div class="empty">Sin métodos.</div>'}
function openParamForm(tipo){const label=tipo==='categoria'?'Categoría':'Método de pago';showModal('Nueva '+label,'<div class="form-group"><label>Nombre</label><input class="input" id="p-nombre"></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="saveParam(\''+tipo+'\')">Guardar</button><button class="btn secondary" onclick="closeModal()">Cancelar</button></div>')}
function saveParam(tipo){const nombre=document.getElementById('p-nombre').value.trim();if(!nombre)return;google.script.run.withSuccessHandler(function(){closeModal();refresh()}).agregarParametro(tipo,nombre)}
function delParam(id){if(!confirm('¿Borrar?'))return;google.script.run.withSuccessHandler(function(){refresh()}).eliminarParametro(id)}
function refresh(){google.script.run.withSuccessHandler(function(data){console.log('getInitData raw:',data);toast('RAW: '+JSON.stringify(data).slice(0,120));if(!data||typeof data!=='object'){toast('Sin datos válidos: '+JSON.stringify(data));return}if(data.errors&&data.errors.length){toast('ERRORES: '+data.errors.join(' | '));console.error('getInitData errors',data.errors)}DATA=data;if(!DATA.mesActual)DATA.mesActual='';if(!DATA.obligaciones)DATA.obligaciones=[];if(!DATA.pagos)DATA.pagos=[];if(!DATA.gastos)DATA.gastos=[];if(!DATA.parametros)DATA.parametros=[];const active=document.querySelector('.page.active').id.replace('page-','');if(active==='dashboard')renderDashboard();if(active==='obligaciones')renderObligaciones();if(active==='gastos')renderGastos();if(active==='parametros')renderParametros();document.getElementById('mesBadge').textContent=fmtMes(DATA.mesActual)}).withFailureHandler(function(e){toast('Error cargando datos: '+(e&&e.message?e.message:e));console.error('getInitData fail',e)}).getInitDataX()}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function attr(s){return String(s==null?'':s).replace(/"/g,'&quot;')}
google.script.run.withSuccessHandler(function(r){toast('PING: '+r);console.log('ping',r);refresh()}).withFailureHandler(function(e){toast('PING FAIL: '+(e&&e.message?e.message:e));console.error('ping fail',e);refresh()}).ping()
document.getElementById('fab').style.display='none';
</script>
</body>
</html>
