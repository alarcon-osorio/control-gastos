name: Gastos
options:
  bundleIdPrefix: com.gastos
  deploymentTarget:
    iOS: "16.0"
  settings:
    base:
      GENERATE_INFOPLIST_FILE: YES
targets:
  Gastos:
    type: application
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alarconosorio.gastosnative
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - path: Gastos
    dependencies:
      - package: supabase-swift
        product: Supabase
packages:
  supabase-swift:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"