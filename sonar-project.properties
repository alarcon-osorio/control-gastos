# SonarCloud configuration
# Identificadores del proyecto (proporcionados por el usuario).
sonar.organization=alarcon-osorio
sonar.projectKey=alarcon-osorio_control-gastos

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/.angular/**,**/*.spec.ts
sonar.coverage.exclusions=**/*.spec.ts,**/environments/**
# Ruta opcional de coverage (generar con: npm run test -- --coverage)
sonar.javascript.lcov.reportPaths=coverage/crud-usuarios/lcov.info

sonar.sourceEncoding=UTF-8
