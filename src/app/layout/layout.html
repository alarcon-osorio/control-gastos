<div class="layout">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" routerLink="/dashboard">
        <span class="brand-icon">💰</span>
        <span class="brand-text">Mis Gastos</span>
      </a>

      <div class="user-area">
        <select
          class="currency-select"
          title="Cambiar moneda"
          aria-label="Seleccionar moneda"
          [ngModel]="monedas.moneda().codigo"
          (ngModelChange)="monedas.setMoneda($event)"
          [ngModelOptions]="{ standalone: true }"
        >
          @for (moneda of monedas.disponibles; track moneda.codigo) {
            <option [value]="moneda.codigo">
              {{ moneda.simbolo }} {{ moneda.codigo }}
            </option>
          }
        </select>
        <span class="user-name">{{ auth.usuario()?.nombre }}</span>
        <button type="button" class="btn-logout" (click)="cerrarSesion()">
          Salir
        </button>
      </div>
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>

  <nav class="bottom-nav" aria-label="Navegación principal">
    <a class="bottom-nav-link" routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" aria-label="Resumen">
      <span class="bottom-nav-icon">📊</span>
    </a>
    <a class="bottom-nav-link" routerLink="/obligaciones" routerLinkActive="active" aria-label="Obligaciones">
      <span class="bottom-nav-icon">✅</span>
    </a>
    <a class="bottom-nav-link" routerLink="/gastos" routerLinkActive="active" aria-label="Gastos">
      <span class="bottom-nav-icon">🧾</span>
    </a>
    <a class="bottom-nav-link" routerLink="/parametros" routerLinkActive="active" aria-label="Parametros">
      <span class="bottom-nav-icon">⚙️</span>
    </a>
  </nav>
</div>
