<div class="layout">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" routerLink="/dashboard">
        <span class="brand-icon">💰</span>
        <span class="brand-text">Mis Gastos</span>
      </a>

      <input type="checkbox" id="nav-toggle" class="nav-toggle" />
      <label for="nav-toggle" class="nav-burger" aria-label="Abrir menú">
        <span></span><span></span><span></span>
      </label>

      <nav class="nav">
        <a
          class="nav-link"
          routerLink="/dashboard"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          📊 Resumen
        </a>
        <a class="nav-link" routerLink="/gastos" routerLinkActive="active">
          🧾 Gastos
        </a>
        <a class="nav-link" routerLink="/obligaciones" routerLinkActive="active">
          ✅ Obligaciones
        </a>
        <a class="nav-link" routerLink="/parametros" routerLinkActive="active">
          ⚙️ Parámetros
        </a>
      </nav>

      <div class="user-area">
        <select
          class="currency-select"
          title="Cambiar moneda"
          aria-label="Seleccionar moneda"
          [ngModel]="monedas.moneda().codigo"
          (ngModelChange)="monedas.setMoneda($event)"
          [ngModelOptions]="{ standalone: true }"
        >
          @for (moneda of monedas.disponibles; track moneda.codigo) {
            <option [value]="moneda.codigo">
              {{ moneda.simbolo }} {{ moneda.codigo }}
            </option>
          }
        </select>
        <span class="user-name">{{ auth.usuario()?.nombre }}</span>
        <button type="button" class="btn-logout" (click)="cerrarSesion()">
          Salir
        </button>
      </div>
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
